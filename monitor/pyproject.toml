[project]
name = "ur-monitor"
version = "3.1.0"
description = "Read-only UR10 RTDE telemetry monitor for Windows"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".venv",
    "__pycache__",
    "vendor",
    "static/vendor",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "ARG",  # unused arguments
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "T20",  # flake8-print (server uses logging)
]
ignore = [
    "S101",    # asserts are fine in tests
    "SIM108",  # ternary is not always clearer
    "RET504",  # allow a final assignment before return
    "S105",    # the "password" here is an environment variable NAME, not a secret
    "T201",    # the CLI helper is a console tool and prints to stderr by design
    "S310",    # the helper only opens URLs supplied by its own CLI operator
    "S104",    # binding 0.0.0.0 is an intentional, documented LAN requirement
    "SIM300",  # comparing a Path against a variable is not a yoda condition
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ARG", "SLF001", "PTH", "E501", "SIM117"]
"tools/*" = ["S", "E501", "ARG", "PTH"]

[tool.ruff.lint.isort]
known-first-party = [
    "server",
    "monitor_config",
    "telemetry_state",
    "events",
    "recording",
    "controller",
    "rtde_client",
    "mac_controller_heartbeat",
]

[tool.ruff.lint.flake8-bugbear]
# The server binds 0.0.0.0 intentionally for the documented LAN heartbeat setup.
extend-immutable-calls = []

[tool.ruff.lint.pylint]
max-args = 8

[tool.mypy]
python_version = "3.10"
files = [
    "server.py",
    "monitor_config.py",
    "telemetry_state.py",
    "events.py",
    "recording.py",
    "controller.py",
    "rtde_client.py",
    "mac_controller_heartbeat.py",
]
exclude = ["^\\.venv/", "^vendor/", "^static/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["rtde.*"]
ignore_missing_imports = true
